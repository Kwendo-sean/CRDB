{% extends 'control/base.html' %}{% block content %}<header class="control-heading"><div><p>{{ kicker }}</p><h1>{{ title }}</h1></div></header><form method="post" class="control-form">{% csrf_token %}{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}<label class="{% if field.field.widget.input_type == 'checkbox' %}check-field{% endif %}"><span>{{ field.label }}</span>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}</div><div class="form-actions"><button class="control-primary">{{ submit }}</button><button type="button" class="control-secondary" onclick="history.back()">CANCEL</button></div></form>{% endblock %}
