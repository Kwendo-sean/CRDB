upstream learning_week_app { server web:8000; keepalive 32; }

# Only echo "upgrade" for requests that actually asked for one. Sending
# Connection: upgrade on every proxied request breaks keepalive reuse.
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# Preserve the scheme an outer proxy already determined. Overwriting it with
# $scheme would tell Django that an HTTPS request arrived over plain HTTP, and
# SECURE_SSL_REDIRECT would then bounce it to HTTPS forever.
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /static/ { alias /var/www/static/; expires 30d; add_header Cache-Control "public, immutable"; access_log off; }
    location /media/ { alias /var/www/media/; expires 1d; add_header X-Content-Type-Options nosniff; }

    # Live quiz sockets idle between questions while the host is speaking, so they
    # need a far longer read timeout than an ordinary page request.
    location /ws/ {
        proxy_pass http://learning_week_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://learning_week_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
    }
}
